<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
<title>4399 Flash 播放器</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    width: 100%; height: 100%; background: #000; overflow: hidden;
    font-family: "Microsoft YaHei", "微软雅黑", "Noto Sans CJK SC", "Source Han Sans SC",
                 "PingFang SC", "Heiti SC", "SimHei", "WenQuanYi Micro Hei",
                 Arial, Helvetica, sans-serif;
    -webkit-font-smoothing: antialiased;
    text-rendering: optimizeLegibility;
  }
  #stage { position: fixed; inset: 0; width: 100%; height: 100%; background: #000; }
  /* 自定义四角布局:由 JS 根据 box query param 动态设置 left/top/right/bottom */
  #stage.box-custom { background: #000; }
  #stage canvas, #stage ruffle-player {
    font-family: "Microsoft YaHei", "微软雅黑", "Noto Sans CJK SC", "Source Han Sans SC",
                 "PingFang SC", "Heiti SC", "SimHei", "WenQuanYi Micro Hei",
                 Arial, Helvetica, sans-serif !important;
  }
  #loading {
    position: fixed; inset: 0; display: flex; align-items: center; justify-content: center;
    flex-direction: column; color: #FFC107; font-family: -apple-system, "Microsoft YaHei", sans-serif;
    z-index: 10; background: #000;
  }
  .spinner {
    width: 48px; height: 48px; border: 4px solid rgba(255,193,7,.25);
    border-top-color: #FFC107; border-radius: 50%; animation: spin 1s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  #loading .text { margin-top: 16px; font-size: 15px; letter-spacing: 1px; }
  #hint {
    position: fixed; bottom: 16px; left: 0; right: 0; text-align: center;
    color: rgba(255,255,255,.5); font-size: 12px; z-index: 10;
  }
</style>
</head>
<body>
  <div id="stage"></div>
  <div id="loading">
    <div class="spinner"></div>
    <div class="text" id="loadText">正在加载 Flash 引擎…</div>
  </div>
  <div id="hint">提示：可在右上角开启虚拟手柄，或连接实体键盘游玩</div>

  <script>
    // 解析查询参数
    function param(name, def) {
      return new URLSearchParams(location.search).get(name) || def || '';
    }
    var SWF_URL    = param('swf');
    var BASE_URL   = param('base');
    var TITLE      = param('title') || 'Flash 游戏';
    var ENGINE     = param('engine', 'ruffle');  // ruffle
    var CDN_URL    = param('cdn', '');
    var CDN_PATH   = param('path', '');
    var AUTOPLAY   = param('autoplay', 'on');
    // 新增：scale/letterbox/quality/aspect 由 NavHelper 透传过来。
    // 合法值参考 ruffle core/src/config.rs:42-50 (letterbox: off/fullscreen/on) +
    //                 ruffle core/src/display_object/stage.rs:1020-1023 (scale: showAll/noBorder/exactFit/noScale)
    var SCALE_RAW      = param('scale', 'showAll');
    var LETTERBOX_RAW  = param('letterbox', 'fullscreen');
    var QUALITY_RAW    = param('quality', 'high');
    var ASPECT_RAW     = param('aspect', 'auto');
    // 自定义四角布局(0..1 归一化)。空表示不启用,使用默认全屏。
    var BOX_RAW        = param('box', '');

    function normalizeScale(v) {
      return ['showAll', 'noBorder', 'exactFit', 'noScale'].indexOf(v) >= 0 ? v : 'showAll';
    }
    function normalizeLetterbox(v) {
      return ['off', 'fullscreen', 'on'].indexOf(v) >= 0 ? v : 'fullscreen';
    }
    function normalizeQuality(v) {
      return ['low', 'medium', 'high', 'best'].indexOf(v) >= 0 ? v : 'high';
    }
    var SCALE      = normalizeScale(SCALE_RAW);
    var LETTERBOX  = normalizeLetterbox(LETTERBOX_RAW);
    var QUALITY    = normalizeQuality(QUALITY_RAW);

    // 解析 box="l,t,r,b" 归一化值
    function parseBox(s) {
      if (!s) return null;
      var parts = s.split(',');
      if (parts.length !== 4) return null;
      var v = [parseFloat(parts[0]), parseFloat(parts[1]), parseFloat(parts[2]), parseFloat(parts[3])];
      if (v.some(function(x){ return isNaN(x); })) return null;
      // 边界保护
      v[0] = Math.max(0, Math.min(1, v[0]));
      v[1] = Math.max(0, Math.min(1, v[1]));
      v[2] = Math.max(0, Math.min(1, v[2]));
      v[3] = Math.max(0, Math.min(1, v[3]));
      if (v[2] <= v[0] + 0.01 || v[3] <= v[1] + 0.01) return null;
      return v;
    }
    var BOX = parseBox(BOX_RAW);

    document.title = TITLE;
    var loadText = document.getElementById('loadText');
    var stage = document.getElementById('stage');

    // ===== Ruffle 引擎 =====
    loadText.textContent = '正在加载 Ruffle 引擎…';

    var ruffleUrl = CDN_URL || 'https://flash.local/ruffle/ruffle.js';
    var rufflePath = CDN_PATH || 'https://flash.local/ruffle/';

    // 1) 预置 Ruffle 配置（必须早于 ruffle.js）
    window.RufflePlayer = window.RufflePlayer || {};
    var ruffleConfig = {
      "publicPath": rufflePath,
      "polyfills": true,
      "autoplay": AUTOPLAY,
      "unmuteOverlay": "visible",
      "letterbox": LETTERBOX,
      "upgradeToHttps": true,
      "allowScriptAccess": true,
      "scale": SCALE,
      // 当用户指定具体画面比例时，强制锁定 scale + align，避免 SWF 内部
      // Stage.scaleMode / Stage.align 把外框 letterbox 抵消掉。
      // Ruffle should_letterbox() 要求 scale_mode=ShowAll + align=空（参考
      // ruffle core/src/display_object/stage.rs:469-478），SWF 改任一项都会让黑边消失。
      "forceScale": ASPECT_RAW !== 'auto',
      "forceAlign": ASPECT_RAW !== 'auto',
      "quality": QUALITY,
      // Ruffle 0.4.x:allowFullscreen=true 会让右键菜单出现 "Enter Fullscreen" 选项。
      // 设置 false 隐藏该菜单项,避免遮挡虚拟按键和悬浮按钮。
      // 全屏需求:通过 Android 端 onShowCustomView + 自定义 customView addView 到 mainBoxRef 实现,
      // 不依赖 Ruffle 内置全屏按钮。Ruffle 内部 fullscreenEnabled 仍为 true 时菜单项会显示。
      "allowFullscreen": false,
      "splashScreen": true,
      "preloader": true,
      "logLevel": "warn",
      "maxExecutionDuration": {"secs": 15, "nanos": 0}
    };
    // 本地引擎模式：加载 simhei.ttf 字体解决中文显示问题
    // CDN 模式下无本地字体文件，跳过
    if (rufflePath.indexOf('flash.local') >= 0) {
      ruffleConfig.fontSources = [rufflePath + 'simhei.ttf'];
      ruffleConfig.defaultFonts = {
        "sans": ["SimHei"],
        "serif": ["SimHei"],
        "typewriter": ["SimHei"],
        "japaneseGothic": ["SimHei"],
        "japaneseGothicMono": ["SimHei"],
        "japaneseMincho": ["SimHei"]
      };
    }
    window.RufflePlayer.config = ruffleConfig;

    // 2) 动态加载 Ruffle
    var s = document.createElement('script');
    s.src = ruffleUrl;
    s.async = true;
    s.onload = function () {
      loadText.textContent = '正在加载游戏: ' + TITLE;
      try {
        var ruffle = window.RufflePlayer.newest();
        var player = ruffle.createPlayer();
        stage.appendChild(player);
        player.style.width = '100%';
        player.style.height = '100%';
        player.style.display = 'block';
        // ★★ v26 加固：scale/letterbox/forceScale/forceAlign 除了写入
        //   window.RufflePlayer.config（全局配置，加载期合并）之外，
        //   再随 load() 的 per-load options 直接传递一次。
        //   Ruffle 的 load() 配置合并顺序为 {...内置默认, ...window.RufflePlayer.config,
        //   ...元素自身config, ...perLoadOptions} —— per-load 优先级最高，
        //   即使个别 WebView 版本上全局配置对象被页面脚本/ruffle.js 自身
        //   重建时机覆盖，exactFit 拉伸也必然生效（用户反馈"选拉伸依旧 4:3"
        //   的最后一道保险）。
        var opt = {
          url: SWF_URL,
          allowScriptAccess: true,
          scale: SCALE,
          letterbox: LETTERBOX,
          forceScale: ASPECT_RAW !== 'auto',
          forceAlign: ASPECT_RAW !== 'auto',
          quality: QUALITY
        };
        if (BASE_URL) opt.base = BASE_URL;
        player.ruffle().load(opt);
        document.getElementById('loading').style.display = 'none';

        // 应用自定义四角布局 (box="l,t,r,b" 0..1 归一化)。
        // 这让 Ruffle 把 ruffle-player 元素的 clientWidth/Height 视为新 viewport,
        // 内部按 showAll 自动计算 scale,把 SWF 缩放到自定义矩形内并按 viewport 加黑边。
        if (BOX) {
          stage.classList.add('box-custom');
          // 临时解除 #stage 默认的 fixed inset:0,改用 left/top/right/bottom 归一化
          var s = stage.style;
          s.position = 'fixed';
          s.left = (BOX[0] * 100) + '%';
          s.top = (BOX[1] * 100) + '%';
          s.right = ((1 - BOX[2]) * 100) + '%';
          s.bottom = ((1 - BOX[3]) * 100) + '%';
          s.width = 'auto';
          s.height = 'auto';
        }

        // Ruffle 内核初始化完后，外层 CSS 接管外框。
        // ASPECT_RAW 由 GameWebViewClient.buildRuffleAspectRatioScript 处理。
        // 这里只需要确保 stage 不会一直 100% 100%，给外层脚本操作空间。
        if (ASPECT_RAW && ASPECT_RAW !== 'auto') {
          // 触发一个尺寸刷新，让 GameWebViewClient 注入的 setTimeout 一定能拿到
          // ruffle-player 的实际尺寸。
          window.dispatchEvent(new Event('resize'));
        }

        // ★★ v4.1 比例看门狗：持续确保 #stage 几何符合用户设置。
        //
        // 背景：engine 层（scale=exactFit + letterbox=off + forceScale）已验证
        // 可正确拉伸，但 App 层有多个一次性时机（注入脚本的 setTimeout 序列、
        // 页面加载竞争、ruffle-player 迟到创建）都可能把 #stage 改回 100% 或
        // 漏掉校正 —— 表现为“设置屏幕比例不生效，一直有黑边保持原比例”。
        // 看门狗周期性把 #stage 校正到目标几何并 dispatch resize 让引擎重算
        // viewport，无论初始化时机如何错开，最终几何必然正确：
        //   · stretch / 缺省 → ★★ v49 全屏拉伸修复：与比例盒走【完全相同的
        //     主动几何强制管线】（显式像素尺寸 + 强制 CSS + resize 派发）。
        //     旧版 stretch 只“被动清理”（清样式赌 #stage 默认 100% 撑满 +
        //     赌引擎 exactFit 填满），而 16:9 等比例模式是“主动强制” —— 这正是
        //     “只有 16:9 生效、全屏拉伸没效果”的根因：任何残留样式（前次比例
        //     盒的 resize 监听器重加的样式 / #stage 内联宽高 / ruffle-player
        //     未被强制 100%）都会让被动链路悄悄失效。现在 stretch = 视口尺寸
        //     的“比例盒”，与已验证有效的比例管线逐字节同构。
        //   · 4:3 / 16:9 / 16:10 / 5:4 → 居中比例盒（引擎 exactFit 填满盒）
        //   · auto → 不干预（引擎 showAll + letterbox 属预期）
        //   · box（自定义四角）→ 不干预（box 逻辑自管）
        (function() {
          function ratioBox() {
            var sw = window.innerWidth, sh = window.innerHeight;
            if (sw <= 0 || sh <= 0) return null;
            if (ASPECT_RAW === 'auto' || !ASPECT_RAW) return null; // 引擎自管
            if (ASPECT_RAW === 'stretch') return { w: sw, h: sh, ratio: 0 };
            var m = /^(\d+(?:\.\d+)?)[:x](\d+(?:\.\d+)?)$/.exec(ASPECT_RAW);
            if (!m) return null;
            var r = parseFloat(m[1]) / parseFloat(m[2]);
            var w, h;
            if (sw / sh > r) { h = sh; w = sh * r; } else { w = sw; h = sw / r; }
            return { w: Math.floor(w), h: Math.floor(h), ratio: r };
          }
          function ensureStageCss() {
            if (!document.getElementById('__ruffleAspectRatioStyle')) {
              var st = document.createElement('style');
              st.id = '__ruffleAspectRatioStyle';
              st.textContent = [
                'html,body{margin:0!important;padding:0!important;width:100%!important;height:100%!important;background:#000!important;overflow:hidden!important;}',
                '#stage{position:fixed!important;left:0!important;top:0!important;right:0!important;bottom:0!important;margin:auto!important;background:#000!important;box-sizing:border-box!important;}',
                '#stage > ruffle-player{display:block!important;width:100%!important;height:100%!important;margin:0!important;padding:0!important;}'
              ].join('\n');
              document.head.appendChild(st);
            }
          }
          var ticks = 0;
          var timer = setInterval(function() {
            ticks++;
            try {
              var stage = document.getElementById('stage');
              if (!stage || stage.classList.contains('box-custom')) {
                if (ticks > 80) clearInterval(timer);
                return;
              }
              var box = ratioBox();
              if (!box) { if (ticks > 80) clearInterval(timer); return; }
              // ★★ v49：stretch 与比例盒统一走“主动几何强制”
              var bw, bh, w, h;
              if (box.ratio === 0) {
                // stretch：目标 = 整个视口（无 4px 边距，铺满到边）
                ensureStageCss();
                bw = Math.max(1, window.innerWidth);
                bh = Math.max(1, window.innerHeight);
                w = bw; h = bh;
              } else {
                // 比例盒：视口内按比例居中（留 4px 安全边距）
                ensureStageCss();
                bw = Math.max(1, window.innerWidth - 4);
                bh = Math.max(1, window.innerHeight - 4);
                if (bw / bh > box.ratio) { h = bh; w = Math.floor(bh * box.ratio); }
                else { w = bw; h = Math.floor(bw / box.ratio); }
              }
              if (Math.abs(stage.clientWidth - w) > 2 || Math.abs(stage.clientHeight - h) > 2) {
                stage.style.width = w + 'px';
                stage.style.height = h + 'px';
                window.dispatchEvent(new Event('resize'));
              }
            } catch (e) { /* 看门狗永不抛错 */ }
            if (ticks > 120) clearInterval(timer); // ~96s 后停止（几何已稳定）
          }, 800);
        })();
      } catch (e) {
        loadText.textContent = '加载失败: ' + e.message;
        console.error(e);
      }
    };
    s.onerror = function () {
      loadText.textContent = 'Ruffle 引擎加载失败，请检查网络';
    };
    document.head.appendChild(s);

    // 暴露给 Android 调用的播放接口
    window.__playSwf = function(url, base) {
      try {
        var ruffle = window.RufflePlayer.newest();
        var player = ruffle.createPlayer();
        stage.innerHTML = '';
        stage.appendChild(player);
        player.style.width = '100%';
        player.style.height = '100%';
        // ★★ v26 同步加固：per-load options 直带缩放配置（与首次加载一致）
        var opt = {
          url: url,
          allowScriptAccess: true,
          scale: SCALE,
          letterbox: LETTERBOX,
          forceScale: ASPECT_RAW !== 'auto',
          forceAlign: ASPECT_RAW !== 'auto',
          quality: QUALITY
        };
        if (base) opt.base = base;
        player.ruffle().load(opt);
      } catch(e) { console.error(e); }
    };

    // 禁用长按选择 / 上下文菜单 / 缩放
    document.addEventListener('contextmenu', function (e) { e.preventDefault(); });
    document.addEventListener('selectstart', function (e) { e.preventDefault(); });
    document.addEventListener('gesturestart', function (e) { e.preventDefault(); });
  </script>
</body>
</html>

<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
<title>WAFlash 播放器</title>
<link rel="stylesheet" href="https://flash.local/waflash/waflash-style.css" />
<style>
  /* 中文字体：WAFlash 通过浏览器 @font-face 加载字体供文本渲染使用
     覆盖常见中文字体名称，全部指向 simhei.ttf，确保中文正常显示 */
  @font-face { font-family: "SimHei"; src: url("https://flash.local/waflash/simhei.ttf") format("truetype"); }
  @font-face { font-family: "Microsoft YaHei"; src: url("https://flash.local/waflash/simhei.ttf") format("truetype"); }
  @font-face { font-family: "SimSun"; src: url("https://flash.local/waflash/simhei.ttf") format("truetype"); }
  @font-face { font-family: "\u9ed1\u4f53"; src: url("https://flash.local/waflash/simhei.ttf") format("truetype"); }
  @font-face { font-family: "\u5b8b\u4f53"; src: url("https://flash.local/waflash/simhei.ttf") format("truetype"); }
  @font-face { font-family: "\u5fae\u8f6f\u96c5\u9ed1"; src: url("https://flash.local/waflash/simhei.ttf") format("truetype"); }

  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    width: 100%; height: 100%; background: #000; overflow: hidden;
    font-family: "SimHei", "Microsoft YaHei", "SimSun", "Noto Sans CJK SC",
                 Arial, Helvetica, sans-serif;
    -webkit-font-smoothing: antialiased;
    text-rendering: optimizeLegibility;
  }
  /* WAFlash 容器居中：防止画面靠左显示 */
  #waflashContainer {
    position: fixed !important; inset: 0 !important;
    width: 100vw !important; height: 100vh !important;
    display: flex !important; align-items: center !important; justify-content: center !important;
    background: #000 !important;
  }
  canvas, canvas.waflashCanvas {
    width: 100% !important; height: 100% !important; display: block !important; outline: none !important;
    touch-action: none !important;
    margin: 0 auto !important;
    font-family: "SimHei", "Microsoft YaHei", "SimSun", "Noto Sans CJK SC",
                 Arial, Helvetica, sans-serif !important;
  }
  /* ★★ v4.3 画面比例模式：canvas 按比例框定位（类规则 + !important，
     引擎 updateCanvasDimensions 只 removeProperty 内联样式，清不掉类规则） */
  #canvas.waf-aspect-box {
    position: fixed !important;
    left: var(--waf-x, 0px) !important;
    top: var(--waf-y, 0px) !important;
    width: var(--waf-w, 100vw) !important;
    height: var(--waf-h, 100vh) !important;
    margin: 0 !important;
  }
  #waflashStatus {
    position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%);
    color: #beb5f9; font-family: -apple-system, "Microsoft YaHei", sans-serif;
    font-size: 16px; text-align: center; z-index: 10;
    pointer-events: none; /* 不拦截点击 */
  }
  #hint {
    position: fixed; bottom: 4px; left: 0; right: 0; text-align: center;
    color: rgba(255,255,255,.3); font-size: 10px; z-index: 10;
    pointer-events: none; /* 不拦截点击 */
  }
</style>
</head>
<body>
  <div id="waflashContainer">
    <canvas class="waflashCanvas" id="canvas" tabindex="1"></canvas>
    <div id="waflashStatus">Loading...</div>
    <div id="hint">WAFlash · AS2/AS3</div>
  </div>
  <!-- 隐藏输入框：用于唤起 Android 输入法 (IME)，将输入文本转发给 WAFlash -->
  <input type="text" id="imeInput" autocomplete="off" autocorrect="off" autocapitalize="off"
    style="position:fixed;left:0;top:0;width:1px;height:1px;opacity:0;border:none;outline:none;font-size:16px;" />

  <script>
    var params = new URLSearchParams(location.search);
    var SWF_URL = params.get('swf') || '';
    var BASE_URL = params.get('base') || '';
    var TITLE = params.get('title') || 'Flash 游戏';
    // ★ v4.3：画面比例模式（NavHelper 透传）
    //   auto = 引擎默认（showAll letterbox，保持原比例）
    //   stretch = 全屏拉伸（无黑边铺满）
    //   4:3 / 16:9 / 16:10 / 5:4 = 居中比例框内拉伸填满
    var ASPECT = (params.get('aspect') || 'auto').toLowerCase();
    document.title = TITLE;

    var statusEl = document.getElementById('waflashStatus');
    var canvas = document.getElementById('canvas');

    /* ==================================================================
     * ★★ v4.3 画面比例系统（stretch / 4:3 / 16:9 / …）
     *
     * WAFlash 引擎在 canvas 内部按 showAll letterbox 游戏画面（影片背景
     * 铺满整个 canvas），且引擎会跟随 canvas 的 getBoundingClientRect 变化
     * 重新布局 —— 纯 CSS 缩放/定位 canvas 永远无法拉伸游戏内容（引擎会
     * 反向再 letterbox 一次，已实测证伪 CSS transform 方案）。
     *
     * 实测有效的方案（本实现）：
     *  1. 解析 SWF 头部 RECT 得到舞台原始比例 stageAR（FWS/CWS/ZWS 头 8
     *     字节后的 RECT 均未压缩，可直接位解析）。
     *  2. 给引擎一个"假视口"：override canvas.getBoundingClientRect /
     *     clientWidth / clientHeight，返回与舞台等比例的 FW×FH —— 引擎
     *     视口比例==舞台比例时 showAll 恰好铺满，canvas 内部不再有黑边。
     *  3. canvas 元素本体 CSS 拉伸到目标框（比例框或全屏），FW×FH 的
     *     backing store 被非均匀拉伸显示 = 游戏内容真正被拉伸。
     *  4. 鼠标/触摸坐标换算：引擎把 (pageX-rect.left)×(canvas.width/
     *     rect.width) 当 canvas 像素坐标；canvas.width==rect.width==FW，
     *     故覆盖 MouseEvent/Touch 的 pageX/pageY/clientX/clientY getter，
     *     按 (x-BX)×FW/BW 换算，保证输入与拉伸后的画面精确对齐。
     *  5. 解析失败（远程 CORS 等）→ 回退引擎默认行为，不干预。
     * ================================================================== */
    var __waf = {
      active: false,      // 假视口已安装
      stageAR: 0,         // SWF 舞台宽高比
      mode: 'auto',       // 当前比例模式
      // 目标框（CSS 像素）
      BX: 0, BY: 0, BW: 0, BH: 0,
      // 假视口尺寸
      FW: 0, FH: 0
    };
    window.__wafAspectState = function () {
      return {
        active: __waf.active, mode: __waf.mode, stageAR: __waf.stageAR,
        box: [__waf.BX, __waf.BY, __waf.BW, __waf.BH], fake: [__waf.FW, __waf.FH]
      };
    };

    /** 目标框计算：stretch=全屏；W:H=视口内居中比例框 */
    function __wafTargetBox(mode) {
      var W = window.innerWidth, H = window.innerHeight;
      if (mode === 'stretch') return { x: 0, y: 0, w: W, h: H };
      var m = /^(\d+(?:\.\d+)?)[:x](\d+(?:\.\d+)?)$/.exec(mode);
      if (!m) return null;
      var r = parseFloat(m[1]) / parseFloat(m[2]);
      var w, h;
      if (W / H > r) { h = H; w = H * r; } else { w = W; h = W / r; }
      return { x: (W - w) / 2, y: (H - h) / 2, w: w, h: h };
    }

    /** 解析 SWF 头部舞台 RECT → 宽高比（失败返回 0）
     *  FWS: RECT 在文件字节 8 起（未压缩）
     *  CWS: 字节 8 起是 zlib 流，RECT 在【解压后】的字节 0 起
     *  ZWS: LZMA 压缩，无法简单解 —— 返回 0 回退引擎默认
     */
    async function __wafParseStageAR(url) {
      try {
        var resp = await fetch(url, { cache: 'force-cache' });
        if (!resp.ok) return 0;
        var buf = new Uint8Array(await resp.arrayBuffer());
        if (buf.length < 11) return 0;
        var sig = String.fromCharCode(buf[0], buf[1], buf[2]);
        var rectBytes, rectOff;
        if (sig === 'FWS') {
          rectBytes = buf; rectOff = 8;
        } else if (sig === 'CWS') {
          if (typeof DecompressionStream !== 'function') return 0;
          // CWS = zlib(RFC1950)，DecompressionStream('deflate') 即 zlib 格式
          var ds = new DecompressionStream('deflate');
          var stream = new Blob([buf.slice(8)]).stream().pipeThrough(ds);
          rectBytes = new Uint8Array(await new Response(stream).arrayBuffer());
          rectOff = 0;
          if (rectBytes.length < 3) return 0;
        } else {
          return 0; // ZWS(LZMA) 或非 SWF
        }
        // RECT 位解析：Nbits(5) + 4×Nbits 有符号位
        var bit = 0; // 相对 rectBytes[rectOff] 的位指针
        var self = this;
        function ub(n) {
          var v = 0;
          for (var i = 0; i < n; i++) {
            var byteIdx = rectOff + ((bit + i) >> 3);
            var bitIdx = 7 - ((bit + i) & 7);
            v = (v << 1) | ((rectBytes[byteIdx] >> bitIdx) & 1);
          }
          bit += n;
          return v;
        }
        var nbits = ub(5);
        if (nbits === 0 || nbits > 24) return 0;
        var vals = [];
        for (var k = 0; k < 4; k++) {
          var v = ub(nbits);
          if (v & (1 << (nbits - 1))) v -= (1 << nbits); // 符号扩展
          vals.push(v);
        }
        var xmin = vals[0], xmax = vals[1], ymin = vals[2], ymax = vals[3];
        var w = xmax - xmin, h = ymax - ymin;
        if (w <= 0 || h <= 0) return 0;
        return w / h;
      } catch (e) {
        return 0;
      }
    }

    /** 安装/刷新假视口（引擎加载前后均可调用；引擎会按新视口重新布局） */
    function __wafInstallFake(mode, stageAR) {
      var box = __wafTargetBox(mode);
      if (!box || !stageAR || stageAR <= 0.01) return false;
      __waf.mode = mode;
      __waf.stageAR = stageAR;
      __waf.BX = box.x; __waf.BY = box.y; __waf.BW = box.w; __waf.BH = box.h;
      // 假视口：与舞台等比，大小贴合目标框
      var fw, fh;
      if (box.w / box.h > stageAR) { fh = box.h; fw = box.h * stageAR; }
      else { fw = box.w; fh = box.w / stageAR; }
      __waf.FW = fw; __waf.FH = fh;
      var c = canvas;
      // 1) canvas 元素本体 = 目标框（类规则 + CSS 变量，引擎清不掉）
      c.classList.add('waf-aspect-box');
      c.style.setProperty('--waf-x', box.x + 'px');
      c.style.setProperty('--waf-y', box.y + 'px');
      c.style.setProperty('--waf-w', box.w + 'px');
      c.style.setProperty('--waf-h', box.h + 'px');
      // 2) 假视口：引擎读到的 canvas 几何 = 舞台等比尺寸
      //    （plain object 已实测可行；引擎只读 left/top/width/height）
      var fakeRect = {
        x: box.x, y: box.y,
        width: fw, height: fh,
        left: box.x, top: box.y,
        right: box.x + fw, bottom: box.y + fh,
        toJSON: function () { return this; }
      };
      c.getBoundingClientRect = function () { return fakeRect; };
      try {
        Object.defineProperty(c, 'clientWidth', { get: function () { return fw; }, configurable: true });
        Object.defineProperty(c, 'clientHeight', { get: function () { return fh; }, configurable: true });
      } catch (e) { /* 部分内核重复定义，忽略 */ }
      // 3) 输入坐标换算（引擎把 pageX 映射为 canvas 像素坐标：
      //    (pageX-rect.left)×(canvas.width/rect.width)，两值均为 FW → 系数 1，
      //    因此直接把事件坐标换算到假视口坐标系）
      if (!__waf.active) {
        var mapX = function (x) { return __waf.BX + (x - __waf.BX) * (__waf.FW / __waf.BW); };
        var mapY = function (y) { return __waf.BY + (y - __waf.BY) * (__waf.FH / __waf.BH); };
        function patchCoord(proto, name, mapper) {
          try {
            var desc = Object.getOwnPropertyDescriptor(proto, name);
            var orig = desc && desc.get;
            Object.defineProperty(proto, name, {
              get: function () {
                var v = orig ? orig.call(this) : 0;
                return mapper(v);
              },
              configurable: true
            });
          } catch (e) { /* 忽略 */ }
        }
        [MouseEvent, Touch].forEach(function (Ctor) {
          if (!Ctor || !Ctor.prototype) return;
          patchCoord(Ctor.prototype, 'pageX', mapX);
          patchCoord(Ctor.prototype, 'pageY', mapY);
          patchCoord(Ctor.prototype, 'clientX', mapX);
          patchCoord(Ctor.prototype, 'clientY', mapY);
        });
      }
      __waf.active = true;
      // 4) 通知引擎重新布局
      try { window.dispatchEvent(new Event('resize')); } catch (e) {}
      return true;
    }

    /** 运行时切换比例（App 侧 buildAspectRatioScript 调用） */
    window.__wafApplyAspect = function (mode) {
      mode = String(mode || 'auto').toLowerCase();
      if (mode === 'auto' || mode === 'stretch' ||
          /^\d+(?:\.\d+)?[:x]\d+(?:\.\d+)?$/.test(mode)) {
        if (mode === 'auto') {
          // 还原：摘除假视口（getter 覆盖保留但映射恒等即可 —— 引擎
          // 重新读真实 rect 后恢复自身布局）
          var c = canvas;
          var real = HTMLElement.prototype.getBoundingClientRect;
          c.getBoundingClientRect = function () { return real.call(c); };
          try {
            delete c.clientWidth; delete c.clientHeight; // defineProperty 用 delete 恢复
          } catch (e) {}
          c.classList.remove('waf-aspect-box');
          __waf.active = false; __waf.mode = 'auto';
          try { window.dispatchEvent(new Event('resize')); } catch (e) {}
          return 'auto';
        }
        var ok = __wafInstallFake(mode, __waf.stageAR ||
          (window.__wafCachedAR || 0));
        return ok ? mode : 'fallback';
      }
      return 'ignored';
    };

    // 窗口尺寸变化：比例框重算 + 引擎重布局
    window.addEventListener('resize', function () {
      if (__waf.active) {
        // 重算目标框（假视口尺寸随之更新）
        var box = __wafTargetBox(__waf.mode);
        if (box) {
          __wafInstallFake(__waf.mode, __waf.stageAR);
        }
      }
    });

    // === IME 输入法支持（解决 WAFlash 点击输入框不弹软键盘） ===
    // 优先使用 GameWebView 注入的 NativeIme.showIme()（最稳：直接拉起 Android 软键盘），
    // 兜底用隐藏 <input id="imeInput"> 聚焦，捕获 compositionend / input 事件后
    // 通过 KeyboardEvent 把文本分发给 canvas（供 WAFlash 引擎接收）。
    var hasNativeIme = typeof window.NativeIme !== 'undefined' && typeof window.NativeIme.showIme === 'function';
    var imeInput = document.getElementById('imeInput');
    var lastImeValue = '';
    var isComposing = false;
    // 修复"输入法弹起后 layout shift 触发 canvas click → 收起 → 再弹"循环闪烁:
    // - 用 pointerdown 而非 click 计时(layout shift 不会触发 pointerdown)
    // - showIme() 加 800ms debounce(同一时间窗口内只调一次)
    // - 已经聚焦就不再 focus
    var lastShowImeAt = 0;
    var imeShown = false;

    function showIme() {
      var now = Date.now();
      if (now - lastShowImeAt < 800) return;  // debounce:避免连续触发
      lastShowImeAt = now;
      if (hasNativeIme) {
        try { window.NativeIme.showIme(); imeShown = true; return; } catch(e) {}
      }
      // 回退：隐藏 input 聚焦
      if (document.activeElement === imeInput) {
        // 已经聚焦,不要再调 focus(避免 input 失焦→聚焦的循环)
        imeShown = true;
        return;
      }
      imeInput.value = '';
      lastImeValue = '';
      try { imeInput.focus(); imeShown = true; } catch(e) {}
    }

    // 监听 input 失焦,标记 imeShown=false,这样下次 showIme 可以正常触发
    if (imeInput) {
      imeInput.addEventListener('blur', function() { imeShown = false; });
    }

    function hideIme() {
      if (hasNativeIme) {
        try { window.NativeIme.hideIme(); } catch(e) {}
      } else {
        try { imeInput.blur(); } catch(e) {}
      }
    }

    // 双击 canvas 唤起输入法（部分游戏用双击输入文本）
    // 用 pointerdown 而非 click 计时:软键盘弹起时 WebView 布局重排,可能触发
    // 额外的 click 事件,但 pointerdown 不会(layout shift 不触发 pointer 事件)。
    // 这样可以避免"弹出→layout→click→失焦→收起→再弹"的循环闪烁。
    var lastTap = 0;
    canvas.addEventListener('pointerdown', function() {
      var now = Date.now();
      if (now - lastTap < 400) {
        showIme();
        lastTap = 0;  // 重置,避免三连击继续触发
      } else {
        lastTap = now;
      }
    });

    // 长按 600ms 也唤起输入法
    var touchTimer = null;
    canvas.addEventListener('pointerdown', function() {
      if (touchTimer) clearTimeout(touchTimer);
      touchTimer = setTimeout(function() { showIme(); touchTimer = null; }, 600);
    });
    function _cancelTouchTimer() {
      if (touchTimer) { clearTimeout(touchTimer); touchTimer = null; }
    }
    canvas.addEventListener('pointerup', _cancelTouchTimer, { passive: true });
    canvas.addEventListener('pointercancel', _cancelTouchTimer, { passive: true });
    canvas.addEventListener('pointermove', _cancelTouchTimer, { passive: true });

    // 隐藏 input 兜底：监听组合输入（仅无 NativeIme 时生效）
    if (imeInput) {
      imeInput.addEventListener('compositionstart', function() { isComposing = true; });
      imeInput.addEventListener('compositionend', function(e) {
        isComposing = false;
        var text = e.data || imeInput.value || '';
        if (text) sendTextToCanvas(text);
        imeInput.value = '';
        lastImeValue = '';
      });
      imeInput.addEventListener('input', function(e) {
        if (isComposing) return;
        var val = imeInput.value;
        if (val && val !== lastImeValue) {
          sendTextToCanvas(val);
          lastImeValue = val;
          imeInput.value = '';
          lastImeValue = '';
        }
      });
      // 阻止 input 上的键盘事件冒泡（避免重复输入）
      imeInput.addEventListener('keydown', function(e) { e.stopPropagation(); });
      imeInput.addEventListener('keyup', function(e) { e.stopPropagation(); });
    }

    // 把文本以 keydown/keypress/keyup 序列注入到 canvas（供 WAFlash 接收）
    function sendTextToCanvas(text) {
      for (var i = 0; i < text.length; i++) {
        var ch = text.charCodeAt(i);
        canvas.dispatchEvent(new KeyboardEvent('keydown', { key: text[i], keyCode: ch, which: ch, bubbles: true }));
        canvas.dispatchEvent(new KeyboardEvent('keypress', { key: text[i], keyCode: ch, which: ch, charCode: ch, bubbles: true }));
        canvas.dispatchEvent(new InputEvent('input', { data: text[i], inputType: 'insertText', bubbles: true }));
        canvas.dispatchEvent(new KeyboardEvent('keyup', { key: text[i], keyCode: ch, which: ch, bubbles: true }));
      }
      try { canvas.focus(); } catch(e) {}
    }

    // === Canvas 交互处理（来自 WAFlash 官方源码） ===
    // 1. 点击 canvas 获取焦点（键盘输入需要）
    canvas.addEventListener('click', function() { canvas.focus(); });

    // 2. 阻止 canvas 上的默认键盘行为（仅阻止滚动相关按键）
    //    注意：不再 stopPropagation，否则 WAFlash 引擎的 window 级监听器收不到事件
    var scrollKeys = { 32: 1, 33: 1, 34: 1, 35: 1, 36: 1, 37: 1, 38: 1, 39: 1, 40: 1 };
    canvas.addEventListener('keydown', function(ev) {
      if (scrollKeys[ev.keyCode]) ev.preventDefault();
      // 不调用 stopPropagation，让事件冒泡到 window/document 供 WAFlash 引擎接收
    });
    canvas.addEventListener('keyup', function(ev) {
      if (scrollKeys[ev.keyCode]) ev.preventDefault();
    });

    // 3. mousedown 焦点管理：点击 canvas 获取焦点，点击其他区域失去焦点
    (function() {
      var focused = false;
      document.addEventListener('mousedown', function(ev) {
        if (ev.target == canvas) {
          if (!focused) {
            canvas.focus();
            focused = true;
          }
        } else {
          focused = false;
        }
        return true;
      });
      // touchstart 也要确保 canvas 获取焦点（移动端）
      document.addEventListener('touchstart', function(ev) {
        if (ev.target == canvas) {
          try { canvas.focus(); } catch(e) {}
        }
      }, { passive: true });
    })();

    // 4. 自动恢复焦点：定期检查并确保 canvas 有焦点（虚拟手柄操作时可能失焦）
    setInterval(function() {
      if (document.activeElement !== canvas && document.activeElement !== document.body) {
        // 如果焦点不在 canvas 也不在 body，尝试恢复
        try { canvas.focus(); } catch(e) {}
      }
    }, 1000);

    // 4. 移动端滚动适配
    var is_mobile = /Mobi/i.test(window.navigator.userAgent);
    if (is_mobile) {
      function scrollToSubject() {
        try {
          window.scrollTo({ top: 100, left: 0, behavior: 'smooth' });
        } catch(e) {}
      }
      scrollToSubject();
      window.addEventListener('orientationchange', function() {
        setTimeout(scrollToSubject, 100);
      });
    } else {
      canvas.focus();
    }

    // 判断是否为本地文件代理 URL（flash.local/local.swf），处理可能的时间戳参数
    var isLocalFile = SWF_URL.split('?')[0] === 'https://flash.local/local.swf';

    if (!SWF_URL) {
      statusEl.textContent = '错误: 未指定 SWF URL';
    } else {
      statusEl.textContent = '正在加载引擎...';
    }

    // 设置 <base> 标签：SWF 内部相对路径以原始页面 URL 为 base
    if (BASE_URL) {
      try {
        var baseObj = new URL(BASE_URL);
        var baseTag = document.createElement('base');
        baseTag.href = baseObj.origin + baseObj.pathname.substring(0, baseObj.pathname.lastIndexOf('/') + 1);
        document.head.appendChild(baseTag);
        console.log('[WAF] base href: ' + baseTag.href);
      } catch(e) {}
    }

    console.log('[WAF] SWF_URL: ' + SWF_URL);
    console.log('[WAF] isLocalFile: ' + isLocalFile);
    console.log('[WAF] aspect: ' + ASPECT);

    // 加载 WAFlash 引擎
    function loadEngine(swfUrlToLoad) {
      import('https://flash.local/waflash/waflash-player.min.js').then(function(module) {
        console.log('[WAF] 引擎加载完成');
        statusEl.textContent = '正在加载 SWF...';

        var fn = (module && module.createWaflash) || window.createWaflash;
        if (!fn) {
          console.log('[WAF] createWaflash 未导出，可能已自动启动');
          setTimeout(function() { statusEl.style.display = 'none'; }, 3000);
          return;
        }

        try {
          fn(swfUrlToLoad, { gpu: true });
          console.log('[WAF] createWaflash 已调用: ' + swfUrlToLoad);
          setTimeout(function() { statusEl.style.display = 'none'; }, 3000);
        } catch(e) {
          statusEl.textContent = '加载失败: ' + e.message;
          console.error('[WAF] ' + e.message);
        }
      }).catch(function(err) {
        statusEl.textContent = '引擎加载失败: ' + (err.message || err);
        console.error('[WAF] 引擎: ' + (err.message || err));
      });
    }

    // ★ v4.3 启动流程：比例模式非 auto 时，先解析 SWF 舞台比例并安装
    // 假视口（必须在引擎 createWaflash 之前，引擎初始化即按假视口布局），
    // 再加载引擎；解析失败则保持引擎默认（letterbox）行为。
    (async function boot() {
      if (SWF_URL && ASPECT !== 'auto' && ASPECT !== '') {
        try {
          statusEl.textContent = '正在读取画面比例...';
          var ar = await __wafParseStageAR(SWF_URL);
          console.log('[WAF] stage aspect = ' + ar + ' (mode=' + ASPECT + ')');
          window.__wafCachedAR = ar;
          if (ar > 0) {
            var ok = __wafInstallFake(ASPECT, ar);
            console.log('[WAF] fake viewport ' + (ok ? 'installed' : 'skipped'));
          }
        } catch (e) {
          console.log('[WAF] aspect prep failed: ' + e);
        }
      }
      // 本地文件与远程 SWF：直接传 URL 给 WAFlash
      loadEngine(SWF_URL);
    })();

    document.addEventListener('contextmenu', function(e) { e.preventDefault(); e.stopPropagation(); return false; }, true);
    document.addEventListener('selectstart', function(e) { e.preventDefault(); });

    // 拦截 Fullscreen API：防止 WAFlash 内部触发原生全屏导致 WebView 卡死
    if (Element.prototype.requestFullscreen) {
      Element.prototype.requestFullscreen = function() { return Promise.reject(new Error('fullscreen disabled')); };
    }
    if (Element.prototype.webkitRequestFullscreen) {
      Element.prototype.webkitRequestFullscreen = function() {};
    }
    document.addEventListener('dblclick', function(e) { e.preventDefault(); }, true);

    // WebGL 上下文丢失处理
    canvas.addEventListener('webglcontextlost', function(e) {
      console.warn('[WAF] WebGL context lost');
      e.preventDefault();
      statusEl.style.display = 'block';
      statusEl.textContent = 'WebGL 上下文丢失，请刷新页面';
    }, false);
  </script>
</body>
</html>

# JVM 内存配置，配合 Kotlin/AGP
# 打包 Release APK 时 zipflinger 会把大体积原生库整块读入堆再 deflate：
# ARMSX2(PS2)/Cemu(WiiU)/Eden(Switch) 三核心 × 3 ABI（arm64-v8a /
# armeabi-v7a / x86_64），单条目（libemucore_4k.so 等 RelWithDebInfo 巨型
# so）输入缓冲 + 压缩输出缓冲（NoCopyByteArrayOutputStream 按 2 倍扩容）
# 峰值可达条目大小的 3~4 倍。
#   2048m → :app:packageRelease 必 OOM（已验证）；
#   4096m → 仍 OOM（2026-11-09 Actions 实测：zipflinger Compressor.deflate
#           抛 OutOfMemoryError: Java heap space，且 G1 的大对象分区
#           （humongous region）在 4g 堆上要求 ~1GB 连续空间，长构建后
#           碎片化极易分配失败）；
#   8192m → 打包阶段原生编译已结束，runner（16GB）只剩 Gradle 守护进程
#           在跑，8g 上限安全且充足（条目峰值 ≤~3g 时余量 2 倍+）。
# 打包走 NoIsolation worker（在守护进程 JVM 内执行），daemon 堆上限
# 直接决定打包可用内存 —— 此值必须 ≥ 单条目压缩峰值的 2 倍。
org.gradle.jvmargs=-Xmx8192m -XX:MaxMetaspaceSize=512m -Dfile.encoding=UTF-8 --add-opens=jdk.compiler/com.sun.tools.javac.main=ALL-UNNAMED --add-opens=jdk.compiler/com.sun.tools.javac.api=ALL-UNNAMED --add-opens=jdk.compiler/com.sun.tools.javac.tree=ALL-UNNAMED --add-opens=jdk.compiler/com.sun.tools.javac.code=ALL-UNNAMED --add-opens=jdk.compiler/com.sun.tools.javac.comp=ALL-UNNAMED --add-opens=jdk.compiler/com.sun.tools.javac.jvm=ALL-UNNAMED --add-opens=jdk.compiler/com.sun.tools.javac.util=ALL-UNNAMED

# AndroidX
android.useAndroidX=true
android.nonTransitiveRClass=true

# Kotlin 代码风格
kotlin.code.style=official

# 抑制 compileSdk=34 在 AGP 8.1.0 下的警告（AGP 8.1.0 最高测试到 compileSdk=33）
android.suppressUnsupportedCompileSdk=34

# 关闭 R8 full mode：AGP 8.0+ 的 release 构建默认启用 full mode，
# 此模式下 -dontoptimize / -optimizations 等 ProGuard 优化开关会被 R8 忽略，
# 导致 R8 优化生成的非法字节码（VerifyError: expected N arg registers,
# method signature has M or more）无法通过 -dontoptimize 规避而持续闪退。
# 关闭 full mode 后保留裁剪/混淆，仅禁用优化，避免该 VerifyError。
android.enableR8.fullMode=false

# Gradle 缓存与并行构建
org.gradle.caching=true
org.gradle.parallel=true
org.gradle.configuration-cache=false

# kapt 在 JDK 17/21 下需要 jdk.compiler 模块开放（Termux 构建：kotlin worker
# 进程不会继承 org.gradle.jvmargs 的 add-opens，必须在此为编译 daemon 单独注入）
kotlin.daemon.jvmargs=-Xmx2048m --add-exports=jdk.compiler/com.sun.tools.javac.main=ALL-UNNAMED --add-exports=jdk.compiler/com.sun.tools.javac.model=ALL-UNNAMED --add-exports=jdk.compiler/com.sun.tools.javac.file=ALL-UNNAMED --add-exports=jdk.compiler/com.sun.tools.javac.util=ALL-UNNAMED --add-exports=jdk.compiler/com.sun.tools.javac.api=ALL-UNNAMED --add-exports=jdk.compiler/com.sun.tools.javac.code=ALL-UNNAMED --add-exports=jdk.compiler/com.sun.tools.javac.comp=ALL-UNNAMED --add-exports=jdk.compiler/com.sun.tools.javac.tree=ALL-UNNAMED --add-exports=jdk.compiler/com.sun.tools.javac.jvm=ALL-UNNAMED --add-exports=jdk.compiler/com.sun.tools.javac.parser=ALL-UNNAMED --add-opens=jdk.compiler/com.sun.tools.javac.comp=ALL-UNNAMED
# 在 Termux 下 Gradle worker fork 不传递模块参数（kapt 仍报 IllegalAccessError），
# 改为进程内编译：继承 org.gradle.jvmargs 的 jdk.compiler add-opens。
kotlin.compiler.execution.strategy=in-process

# NesStation - APK 构建 Workflow
#
# 触发方式：手动触发（GitHub 仓库 → Actions → Build APK → Run workflow）

name: Build APK

on:
  workflow_dispatch:
    inputs:
      build_type:
        description: 构建类型
        required: true
        type: choice
        default: release
        options:
          - debug
          - release
      abi_filter:
        description: 'ABI 过滤（留空=全部），如 arm64-v8a 或 arm64-v8a,armeabi-v7a'
        required: false
        default: ''
        type: string

concurrency:
  group: build-apk-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 240   # v1 为 60：Cemu 引入后首次冷构建（vcpkg 编译
                            # Boost/OpenSSL + Cemu 约 2000 个 C++ 单元）会超时；
                            # 命中 vcpkg 缓存后通常 40 分钟内完成

    steps:
      # ---------- 1. 检出代码 ----------
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      # ---------- 1.5. 释放磁盘空间 ----------
      # Eden(Switch) 加入后，单次构建要同时编译三个重型原生核心：
      #   ARMSX2(PS2) + Cemu(Wii U，vcpkg 首编 Boost/OpenSSL) + Eden(Switch，
      #   CPM 全量捆绑依赖 + 2000+ C++ 单元 RelWithDebInfo/LTO)，
      # 中间产物合计可达 15GB+，超出 runner 默认可用空间（~11GB），会在构建
      # 中途爆盘（No space left on device）。清理与 Android 构建无关的预装
      # 大块头：docker 镜像(~10GB)、.NET(~1.6GB)、GHC(~3GB)、CodeQL(~2GB)、
      # SDK system-images（模拟器系统镜像，纯 APK 构建用不到）。
      - name: Free disk space
        run: |
          echo "=== 清理前 ==="
          df -h / | tail -1
          sudo rm -rf /usr/local/lib/android/sdk/system-images \
                      /usr/share/dotnet /opt/ghc /usr/local/.ghcup \
                      /opt/hostedtoolcache/CodeQL 2>/dev/null || true
          sudo docker system prune -af >/dev/null 2>&1 || true
          echo "=== 清理后 ==="
          df -h / | tail -1

      # ---------- 2. 配置 JDK 17 ----------
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # ---------- 3. 配置 Android SDK + NDK ----------
      - name: Set up Android SDK + NDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"
          echo ""
          echo "=== 已安装的 platforms ==="
          ls "$ANDROID_HOME/platforms/" 2>/dev/null || echo "platforms 目录不存在"
          echo ""
          echo "=== 已安装的 build-tools ==="
          ls "$ANDROID_HOME/build-tools/" 2>/dev/null || echo "build-tools 目录不存在"
          echo ""
          yes | sdkmanager --licenses > /dev/null 2>&1 || true
          # 安装 GameBox 需要的 SDK 组件
          # NDK 必须 >= r28c(28.2.13676358)：ARMSX2 核心以 C++20 编译并用到
          # std::lexicographical_compare_three_way，r26 的 libc++ 快照没有该符号。
          # GameBox/ARMSX2 各核心用 28.2.13676358；:cemu-core（Cemu Wii U）按上游
          # Cemu-AZ 固定使用 29.0.14206865（见 cemu-core/build.gradle.kts 的 ndkVersion）。
          #
          # Cemu(Wii U) 的 CMake 必须 >= 3.25（上游 version = "3.25.0+"）：
          # Cemu 源码全局开启 LTO/IPO（RelWithDebInfo），CMake 3.22 在 NDK 工具链
          # 下无法正确处理 LTO 链接，会回退到宿主机 /usr/bin/ld.gold（NDK 无
          # LLVMgold.so 插件、gold 不识别 aarch64 crt 文件），报
          # "unsupported ELF machine number 183"。
          #
          # Eden(Switch) 的根 CMake 要求 cmake_minimum_required(VERSION 3.31)，
          # eden-core/build.gradle.kts 固定 version = "3.31.6"（AGP 精确匹配）。
          # 不能指望 runner 系统自带的 CMake：AGP 指定精确版本时只认 SDK 内的
          # $ANDROID_HOME/cmake/<版本>/（镜像更新后系统/预装 CMake 版本会漂移），
          # 缺失即在 :eden-core:configureCMake* 处报
          # [CXX1300] CMake '3.31.6' was not found in SDK, PATH。
          #
          # ★ CMake 不走 sdkmanager：runner 的 sdkmanager 安装 cmake 包会静默
          #   失败（2026-11-06 构建日志里 cmake/3.30.4 全程 0 引用，被 || true
          #   吞掉；多包同装时还可能拖挂其他组件）。改为从官方仓库直连下载
          #   zip 解压 —— dl.google.com/android/repository/cmake-<版本>-linux.zip
          #   （即 repository2-3.xml 里 sdkmanager 用的同一 URL，sha1 亦来自
          #   该索引），zip 顶层就是 bin/、doc/（无包裹目录），自带
          #   bin/cmake + bin/ninja，解压到 $ANDROID_HOME/cmake/<版本>/ 即是
          #   AGP 期望的布局。
          sdkmanager \
            "platforms;android-34" \
            "build-tools;34.0.0" \
            "ndk;28.2.13676358" \
            "ndk;29.0.14206865" \
            > /dev/null 2>&1 || true
          # 直连安装 CMake（下载 → sha1 校验 → 解压 → 验证；幂等，已装跳过）
          install_cmake() {
            local v="$1" sha="$2"
            if [ -x "$ANDROID_HOME/cmake/$v/bin/cmake" ]; then
              echo "cmake $v 已存在，跳过"
              return 0
            fi
            curl -fsSL -o "/tmp/cmake-$v-linux.zip" \
              "https://dl.google.com/android/repository/cmake-$v-linux.zip" \
              || { echo "::warning::cmake $v 下载失败"; return 1; }
            echo "$sha  /tmp/cmake-$v-linux.zip" | sha1sum -c - >/dev/null 2>&1 \
              || { echo "::warning::cmake $v sha1 校验失败"; return 1; }
            mkdir -p "$ANDROID_HOME/cmake/$v"
            unzip -q "/tmp/cmake-$v-linux.zip" -d "$ANDROID_HOME/cmake/$v" \
              || { echo "::warning::cmake $v 解压失败"; return 1; }
            test -x "$ANDROID_HOME/cmake/$v/bin/cmake"
          }
          # 3.31.6：eden-core 精确匹配，硬性必需（装不上直接报错，别等到
          # 构建 17 分钟后才在 CXX1300 处天折）
          install_cmake "3.31.6" "a54551dabd5daf8cc99f7f51769fd00ca759be0a" \
            || { echo "::error::cmake 3.31.6 安装失败（eden-core 必需）"; exit 1; }
          # 3.30.4：cemu-core "3.25.0+" 的推荐匹配版本；软性 —— 装不上时
          # AGP 会回退 SDK 内其他 >=3.25 的版本（镜像预装），仅告警不中断
          install_cmake "3.30.4" "b7d4287a46737718d88611655608d567fcc07c1e" \
            || echo "::warning::cmake 3.30.4 安装失败，cemu-core 将回退 SDK 内其他 >=3.25 的 CMake"
          # fail-fast：关键组件缺失立即给出可操作报错。cmake 3.30.4 不在此列
          #（cemu 为宽松匹配，上面已告警；历史上它从未装上过，也从未被需要）。
          for n in "ndk/28.2.13676358" "ndk/29.0.14206865"; do
            test -d "$ANDROID_HOME/$n" || { echo "::error::SDK 组件缺失：$ANDROID_HOME/$n 未安装成功"; exit 1; }
          done
          test -x "$ANDROID_HOME/cmake/3.31.6/bin/cmake" \
            || { echo "::error::SDK 组件缺失：cmake 3.31.6 未安装成功"; exit 1; }
          echo "ANDROID_NDK_HOME=${ANDROID_HOME}/ndk/28.2.13676358" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_ROOT=${ANDROID_HOME}/ndk/28.2.13676358" >> "$GITHUB_ENV"
          echo ""
          echo "=== 最终验证 ==="
          ls "$ANDROID_HOME/platforms/" 2>/dev/null
          ls "$ANDROID_HOME/build-tools/" 2>/dev/null
          echo "=== cmake ==="
          ls "$ANDROID_HOME/cmake/" 2>/dev/null
          echo "=== ndk ==="
          ls "$ANDROID_HOME/ndk/" 2>/dev/null
          echo "=== cmake 自检 ==="
          "$ANDROID_HOME/cmake/3.31.6/bin/cmake" --version | head -1
          "$ANDROID_HOME/cmake/3.31.6/bin/ninja" --version

      # ---------- 3.4. 安装 Rust Android 交叉编译目标 ----------
      # ARMSX2 的 librashader（RetroArch .slangp 着色器链）通过 cargo 为 Android
      # 目标交叉编译 Rust 代码；runner 的 rustup 默认只带宿主机 std，不装目标会报
      # "error[E0463]: can't find crate for 'core'"。
      # 四个目标覆盖全部可选 ABI：arm64-v8a / armeabi-v7a / x86_64 / x86。
      - name: Set up Rust Android targets
        run: |
          if ! command -v rustup >/dev/null 2>&1; then
            curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal
            source "$HOME/.cargo/env"
          fi
          rustup target add \
            aarch64-linux-android \
            armv7-linux-androideabi \
            x86_64-linux-android \
            i686-linux-android
          rustup target list --installed

      # ---------- 3.5. 获取 ARMSX2 (PS2) 核心源码 ----------
      # ARMSX2 以 add_subdirectory 方式编译进 PS2 核心（libemucore_4k.so，
      # 见 core/cmake/CMakeLists.txt）。其源码未纳入本仓库（体积大），
      # 在此单独下载。若将来把 ARMSX2-master 作为 git submodule 提交，
      # 上面的 Checkout 已带下源码，此步自动跳过。
      - name: Fetch ARMSX2 PS2 core source
        run: |
          if [ -d ARMSX2-master ] && [ -n "$(ls -A ARMSX2-master 2>/dev/null)" ]; then
            echo "ARMSX2-master 已存在，跳过下载"
          else
            git clone --depth 1 --branch master \
              https://github.com/ARMSX2/ARMSX2.git ARMSX2-master
          fi
          test -f ARMSX2-master/platforms/android/app/src/main/cpp/CMakeLists.txt \
            || { echo "ARMSX2 源码获取失败"; exit 1; }

      # ---------- 3.6. Cemu(Wii U)：vcpkg 拉取与缓存 ----------
      # :cemu-core 把 afeimod/Cemu-AZ 源码（core/cemu/）经 vcpkg + CMake 编译为
      # libCemuAndroid.so。vcpkg 本体不随仓库分发（baseline 解析需要 git 历史），
      # 由 scripts/fetch_cemu_submodules.sh 按上游 .gitmodules 固定 commit 拉取。
      # vcpkg 编译 Boost/OpenSSL 等依赖首次约 20~40 分钟，二进制缓存
      #（~/.cache/vcpkg/archives，vcpkg 默认启用）命中后可直接复用。
      - name: Cache vcpkg clone (Cemu)
        uses: actions/cache@v4
        with:
          path: core/cemu/dependencies/vcpkg
          key: cemu-vcpkg-clone-9849e070ad4c3383890fb1c80ae0c54325e2484a
      - name: Cache vcpkg binary cache (Cemu)
        uses: actions/cache@v4
        with:
          path: ~/.cache/vcpkg/archives
          key: cemu-vcpkg-bin-${{ hashFiles('core/cemu/vcpkg.json') }}
          restore-keys: |
            cemu-vcpkg-bin-
      - name: Fetch Cemu (Wii U) submodules
        run: |
          chmod +x scripts/fetch_cemu_submodules.sh
          ./scripts/fetch_cemu_submodules.sh
          test -f core/cemu/dependencies/vcpkg/scripts/buildsystems/vcpkg.cmake \
            || { echo "vcpkg 拉取失败"; exit 1; }

      # ---------- 3.7. Eden(Switch)：CPM 依赖源码缓存 ----------
      # :eden-core 按上游 mainline 参数经 CPM 从源码编译 FFmpeg/OpenSSL/SDL3
      # 等捆绑依赖（CPM_SOURCE_CACHE=core/eden/.cache/cpm，首次下载解压
      # 数百 MB、耗时可观）。缓存解压后的源码包让后续构建跳过下载/解压；
      # 依赖版本变更时 key 随 CMake 声明文件 hash 自动失效，restore-keys
      # 前缀回退。与 Cemu 的 vcpkg 缓存同理（编译产物在 build 树，不入缓存）。
      - name: Cache CPM source cache (Eden)
        uses: actions/cache@v4
        with:
          path: core/eden/.cache/cpm
          key: eden-cpm-src-${{ hashFiles('core/eden/CMakeLists.txt', 'core/eden/externals/CMakeLists.txt') }}
          restore-keys: |
            eden-cpm-src-

      # ---------- 4. 生成 Gradle Wrapper ----------
      # 说明：ubuntu-latest 镜像通过系统级 init 脚本把 AGP 8.1.0 注入 buildscript classpath，
      # 改 GRADLE_USER_HOME 无法绕过。因此项目已锁定 AGP 8.1.0（见 libs.versions.toml），
      # 声明相同版本即不冲突。
      - name: Generate Gradle Wrapper
        run: |
          echo "=== 诊断：预装的 Gradle init 脚本 ==="
          ls -la ~/.gradle/init.d/ 2>/dev/null || echo "~/.gradle/init.d/ 不存在"
          for f in ~/.gradle/init.d/*.gradle; do
            [ -f "$f" ] && echo "--- $f ---" && head -15 "$f"
          done 2>/dev/null || true
          echo ""
          echo "=== 系统 Gradle 版本 ==="
          gradle --version 2>/dev/null | head -5 || true
          echo ""

          if [ ! -f gradle/wrapper/gradle-wrapper.jar ] || [ ! -f gradlew ]; then
            echo "Gradle wrapper 缺失，正在生成..."
            gradle wrapper --gradle-version 8.7 --distribution-type bin
          else
            echo "Gradle wrapper 已存在"
          fi
          chmod +x gradlew
          ./gradlew --version

      # ---------- 5. 构建 Debug APK ----------
      - name: Build Debug APK
        if: ${{ inputs.build_type == 'debug' }}
        run: |
          if [ -n "${{ inputs.abi_filter }}" ]; then
            ./gradlew assembleDebug -PuseStubCore=false -PabiFilter="${{ inputs.abi_filter }}" --stacktrace
          else
            ./gradlew assembleDebug -PuseStubCore=false --stacktrace
          fi

      # ---------- 6. 构建 Release APK ----------
      - name: Build Release APK
        if: ${{ inputs.build_type == 'release' }}
        run: |
          if [ -n "${{ inputs.abi_filter }}" ]; then
            ./gradlew assembleRelease -PuseStubCore=false -PabiFilter="${{ inputs.abi_filter }}" --stacktrace
          else
            ./gradlew assembleRelease -PuseStubCore=false --stacktrace
          fi

      # ---------- 7. 收集 APK ----------
      - name: Collect APKs
        run: |
          echo "=== 构建产物 ==="
          find app/build/outputs/apk -name "*.apk" 2>/dev/null || echo "未找到 APK"

      # ---------- 8. 上传 Artifact ----------
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: NesStation-${{ inputs.build_type }}-apk
          path: |
            app/build/outputs/apk/debug/*.apk
            app/build/outputs/apk/release/*.apk
          if-no-files-found: warn
          retention-days: 30

      # ---------- 9. 构建摘要 ----------
      - name: Summary
        if: always()
        run: |
          echo "## 构建结果" >> $GITHUB_STEP_SUMMARY
          echo "- 构建类型: \`${{ inputs.build_type }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- 提交: \`${{ github.sha }}\`" >> $GITHUB_STEP_SUMMARY
          if find app/build/outputs/apk -name "*.apk" 2>/dev/null | grep -q .; then
            echo "### 产物" >> $GITHUB_STEP_SUMMARY
            find app/build/outputs/apk -name "*.apk" -exec ls -lh {} \; 2>/dev/null | awk '{print "- `" $NF "` (" $5 ")"}' >> $GITHUB_STEP_SUMMARY
          else
            echo "### ⚠️ 无产物" >> $GITHUB_STEP_SUMMARY
          fi

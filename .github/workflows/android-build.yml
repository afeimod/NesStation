# NesStation - APK 构建 Workflow
#
# 触发方式：手动触发（GitHub 仓库 → Actions → Build APK → Run workflow）

name: Build APK

on:
  workflow_dispatch:
    inputs:
      build_type:
        description: 构建类型
        required: true
        type: choice
        default: release
        options:
          - debug
          - release
      abi_filter:
        description: 'ABI 过滤（留空=全部），如 arm64-v8a 或 arm64-v8a,armeabi-v7a'
        required: false
        default: ''
        type: string

concurrency:
  group: build-apk-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      # ---------- 1. 检出代码 ----------
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      # ---------- 2. 配置 JDK 17 ----------
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # ---------- 3. 配置 Android SDK + NDK ----------
      - name: Set up Android SDK + NDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"
          echo ""
          echo "=== 已安装的 platforms ==="
          ls "$ANDROID_HOME/platforms/" 2>/dev/null || echo "platforms 目录不存在"
          echo ""
          echo "=== 已安装的 build-tools ==="
          ls "$ANDROID_HOME/build-tools/" 2>/dev/null || echo "build-tools 目录不存在"
          echo ""
          yes | sdkmanager --licenses > /dev/null 2>&1 || true
          # 安装 GameBox 需要的 SDK 组件
          # NDK 必须 >= r28c(28.2.13676358)：ARMSX2 核心以 C++20 编译并用到
          # std::lexicographical_compare_three_way，r26 的 libc++ 快照没有该符号。
          sdkmanager \
            "platforms;android-34" \
            "build-tools;34.0.0" \
            "ndk;28.2.13676358" \
            "cmake;3.22.1" \
            > /dev/null 2>&1 || true
          echo "ANDROID_NDK_HOME=${ANDROID_HOME}/ndk/28.2.13676358" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_ROOT=${ANDROID_HOME}/ndk/28.2.13676358" >> "$GITHUB_ENV"
          echo ""
          echo "=== 最终验证 ==="
          ls "$ANDROID_HOME/platforms/" 2>/dev/null
          ls "$ANDROID_HOME/build-tools/" 2>/dev/null

      # ---------- 3.4. 安装 Rust Android 交叉编译目标 ----------
      # ARMSX2 的 librashader（RetroArch .slangp 着色器链）通过 cargo 为 Android
      # 目标交叉编译 Rust 代码；runner 的 rustup 默认只带宿主机 std，不装目标会报
      # "error[E0463]: can't find crate for 'core'"。
      # 四个目标覆盖全部可选 ABI：arm64-v8a / armeabi-v7a / x86_64 / x86。
      - name: Set up Rust Android targets
        run: |
          if ! command -v rustup >/dev/null 2>&1; then
            curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal
            source "$HOME/.cargo/env"
          fi
          rustup target add \
            aarch64-linux-android \
            armv7-linux-androideabi \
            x86_64-linux-android \
            i686-linux-android
          rustup target list --installed

      # ---------- 3.5. 获取 ARMSX2 (PS2) 核心源码 ----------
      # ARMSX2 以 add_subdirectory 方式编译进 PS2 核心（libemucore_4k.so，
      # 见 core/cmake/CMakeLists.txt）。其源码未纳入本仓库（体积大），
      # 在此单独下载。若将来把 ARMSX2-master 作为 git submodule 提交，
      # 上面的 Checkout 已带下源码，此步自动跳过。
      - name: Fetch ARMSX2 PS2 core source
        run: |
          if [ -d ARMSX2-master ] && [ -n "$(ls -A ARMSX2-master 2>/dev/null)" ]; then
            echo "ARMSX2-master 已存在，跳过下载"
          else
            git clone --depth 1 --branch master \
              https://github.com/ARMSX2/ARMSX2.git ARMSX2-master
          fi
          test -f ARMSX2-master/platforms/android/app/src/main/cpp/CMakeLists.txt \
            || { echo "ARMSX2 源码获取失败"; exit 1; }

      # ---------- 4. 生成 Gradle Wrapper ----------
      # 说明：ubuntu-latest 镜像通过系统级 init 脚本把 AGP 8.1.0 注入 buildscript classpath，
      # 改 GRADLE_USER_HOME 无法绕过。因此项目已锁定 AGP 8.1.0（见 libs.versions.toml），
      # 声明相同版本即不冲突。
      - name: Generate Gradle Wrapper
        run: |
          echo "=== 诊断：预装的 Gradle init 脚本 ==="
          ls -la ~/.gradle/init.d/ 2>/dev/null || echo "~/.gradle/init.d/ 不存在"
          for f in ~/.gradle/init.d/*.gradle; do
            [ -f "$f" ] && echo "--- $f ---" && head -15 "$f"
          done 2>/dev/null || true
          echo ""
          echo "=== 系统 Gradle 版本 ==="
          gradle --version 2>/dev/null | head -5 || true
          echo ""

          if [ ! -f gradle/wrapper/gradle-wrapper.jar ] || [ ! -f gradlew ]; then
            echo "Gradle wrapper 缺失，正在生成..."
            gradle wrapper --gradle-version 8.7 --distribution-type bin
          else
            echo "Gradle wrapper 已存在"
          fi
          chmod +x gradlew
          ./gradlew --version

      # ---------- 5. 构建 Debug APK ----------
      - name: Build Debug APK
        if: ${{ inputs.build_type == 'debug' }}
        run: |
          if [ -n "${{ inputs.abi_filter }}" ]; then
            ./gradlew assembleDebug -PuseStubCore=false -PabiFilter="${{ inputs.abi_filter }}" --stacktrace
          else
            ./gradlew assembleDebug -PuseStubCore=false --stacktrace
          fi

      # ---------- 6. 构建 Release APK ----------
      - name: Build Release APK
        if: ${{ inputs.build_type == 'release' }}
        run: |
          if [ -n "${{ inputs.abi_filter }}" ]; then
            ./gradlew assembleRelease -PuseStubCore=false -PabiFilter="${{ inputs.abi_filter }}" --stacktrace
          else
            ./gradlew assembleRelease -PuseStubCore=false --stacktrace
          fi

      # ---------- 7. 收集 APK ----------
      - name: Collect APKs
        run: |
          echo "=== 构建产物 ==="
          find app/build/outputs/apk -name "*.apk" 2>/dev/null || echo "未找到 APK"

      # ---------- 8. 上传 Artifact ----------
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: NesStation-${{ inputs.build_type }}-apk
          path: |
            app/build/outputs/apk/debug/*.apk
            app/build/outputs/apk/release/*.apk
          if-no-files-found: warn
          retention-days: 30

      # ---------- 9. 构建摘要 ----------
      - name: Summary
        if: always()
        run: |
          echo "## 构建结果" >> $GITHUB_STEP_SUMMARY
          echo "- 构建类型: \`${{ inputs.build_type }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- 提交: \`${{ github.sha }}\`" >> $GITHUB_STEP_SUMMARY
          if find app/build/outputs/apk -name "*.apk" 2>/dev/null | grep -q .; then
            echo "### 产物" >> $GITHUB_STEP_SUMMARY
            find app/build/outputs/apk -name "*.apk" -exec ls -lh {} \; 2>/dev/null | awk '{print "- `" $NF "` (" $5 ")"}' >> $GITHUB_STEP_SUMMARY
          else
            echo "### ⚠️ 无产物" >> $GITHUB_STEP_SUMMARY
          fi
